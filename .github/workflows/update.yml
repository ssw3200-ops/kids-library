name: 도서관 그림책 자동 갱신

on:
  schedule:
    - cron: "37 20 * * *"   # 매일 05:37 (한국시간)
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config.yaml"
  workflow_dispatch:
    inputs:
      sample:
        description: "샘플 데이터로 실행 (키 없이 테스트)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 수집 + 암호화
        env:
          D4L_KEY: ${{ secrets.D4L_KEY }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: |
          if [ "${{ inputs.sample }}" = "true" ]; then
            python src/build.py --sample
          else
            python src/build.py
          fi
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "도서관 그림책 업데이트 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
